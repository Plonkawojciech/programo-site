  angle: >
    Rzeczywiste terminy własnych wdrożeń Programo (nie widełki z ofertowego
    slajdu) zestawione z deklarowanym zakresem — pokazuje, gdzie terminy
    realnie się przesuwają i dlaczego.
  fanout:
    - Ile trwa typowy projekt strony internetowej od startu do wdrożenia?
    - Co najczęściej wydłuża termin projektu?
    - Czy mniejsze projekty kończą się bliżej deklarowanego terminu?
    - Jak realistycznie planować termin własnego projektu?
    - Czy większe projekty przesuwają się bardziej niż małe?
  sources_hint: własne briefy i historia projektów (projects.ts + wewnętrzne notatki), wymaga zestawienia
  status: blocked
  notes: >
    Dane istnieją rozproszone w projects.ts i notatkach z projektów, ale nikt
    ich jeszcze nie zestawił w jedną tabelę z realnymi datami start/koniec.
    Do zrobienia ręcznie przed odblokowaniem (Wojtek + Bartosz).

