    - Czy cross-platform jest zawsze tańszy?
    - Jak dostęp do funkcji systemowych wpływa na wybór technologii?
    - Ile trwa wydanie aplikacji na obu platformach naraz?
  sources_hint: /projects/jedmar na programo.pl, dokumentacja React Native / Flutter
  status: ready
  notes: ""

- slug: software-house-czy-freelancer
  cluster: software-house-vs-alternatywy
  question: Software house czy freelancer — co wybrać do projektu?
  angle: >
    Uczciwe zestawienie ryzyk (ciągłość, dostępność kompetencji, odpowiedzialność
    prawna) zamiast jednostronnej promocji software house'u.
  fanout:
    - Czym różni się współpraca z software house'em od freelancerem?
    - Co się dzieje, gdy freelancer zniknie w trakcie projektu?
    - Kiedy freelancer jest lepszym wyborem?
    - Jak wygląda odpowiedzialność prawna w obu modelach?
    - Jak wygląda wsparcie po zakończeniu projektu w obu modelach?
  sources_hint: własne doświadczenie Programo (2-osobowa firma — punkt wyjścia do uczciwości)
  status: ready
  notes: ""

- slug: no-code-czy-wlasny-kod
  cluster: software-house-vs-alternatywy
  question: No-code czy własny kod — kiedy no-code wystarczy?
  angle: >
    Konkretne progi, po których no-code przestaje się skalować (integracje,
    wydajność, koszt narzędzia przy skali), nie ogólne "to zależy".
  fanout:
    - Jakie projekty da się zrobić w no-code?
    - Kiedy no-code przestaje wystarczać?
    - Czy da się migrować z no-code do własnego kodu?
    - Ile kosztuje narzędzie no-code przy dużej skali?
    - Czy no-code nadaje się do projektu z integracjami zewnętrznymi?
  sources_hint: cenniki popularnych narzędzi no-code (do sprawdzenia na żywo)
  status: ready
  notes: ""

- slug: wlasny-zespol-it-czy-software-house
  cluster: software-house-vs-alternatywy
  question: Własny zespół IT czy zewnętrzny software house?
  angle: >
    Próg opłacalności (liczba projektów rocznie, ciągłość pracy), po którym
    warto zatrudnić własny zespół zamiast zlecać na zewnątrz.
  fanout:
    - Kiedy opłaca się zatrudnić własny zespół IT?
    - Ile kosztuje utrzymanie jednego programisty w porównaniu do zlecenia?
    - Czy da się połączyć własny zespół z zewnętrznym wsparciem?
    - Jakie ryzyko niesie zależność od jednej osoby w zespole?
    - Jak długo trwa rekrutacja własnego programisty?
  sources_hint: dane rynkowe wynagrodzeń IT (do zweryfikowania na żywo, źródło jawnie podane)
  status: ready
  notes: ""

- slug: ktore-boty-ai-odwiedzaja-polska-strone-firmowa
  cluster: wlasne-dane
  question: Które boty AI faktycznie odwiedzają polską stronę firmową?
  angle: >
    Największa dźwignia klastra "własne dane" — realne logi crawlerów
    (OAI-SearchBot, Claude-SearchBot, PerplexityBot) z src/lib/analytics/ai-crawlers.ts
    i store.ts, czyli dane, których nie ma nikt inny publikujący po polsku.
  fanout:
    - Jak często boty AI odwiedzają małą stronę firmową?
    - Który silnik AI crawluje najczęściej — ChatGPT, Perplexity, Claude?
    - Czy boty AI czytają /llms.txt?
    - Jak sprawdzić, które boty odwiedzają własną stronę?
    - Czy liczba wizyt botów AI rośnie z czasem?
  sources_hint: src/lib/analytics/ai-crawlers.ts + store.ts (Redis), min. 90 dni logów
  status: blocked
  notes: >
    Wdrożenie logowania crawlerów AI miało miejsce 2026-08-08 — potrzeba
    min. 90 dni danych, żeby liczby były reprezentatywne, nie przypadkowym
    zrzutem tygodnia. Odblokuje się w listopadzie 2026.

- slug: ile-realnie-trwaja-projekty-programo
  cluster: wlasne-dane
