# Kolejka tematów bloga programo.pl — kwartał 3/2026 (sierpień-październik).
#
# KTO I KIEDY UZUPEŁNIA: człowiek (Wojtek, ew. z Bartoszem), raz na kwartał,
# w osobnej sesji planującej. NIE automat. Cotygodniowa rutyna w chmurze
# (docs/content/PUBLISHING.md) tylko CZYTA ten plik i bierze pierwszą pozycję
# ready — nigdy go nie dopisuje ani nie wymyśla tematów sama, bo kolejka to
# jedyne miejsce, gdzie człowiek decyduje o priorytetach i widzi z wyprzedzeniem,
# co się opublikuje.
#
# DLACZEGO KLASTRY, A NIE POJEDYNCZE FRAZY: Google (i asystenci AI) rozsyłają
# jedno zapytanie na wiele powiązanych (query fan-out) — kto pyta "ile kosztuje
# aplikacja mobilna", dostaje też odpowiedź złożoną z pytań o natywność, opłaty
# sklepowe, MVP. Wygrywa pokrycie całego klastra pytań, nie jeden zoptymalizowany
# tekst pod jedną frazę. Stąd `cluster` grupuje posty, a `fanout` w każdej
# pozycji to lista pytań pobocznych, na które TEN tekst ma dać odpowiedź —
# krótką, nawet jednym zdaniem w treści albo w FAQ, nie osobnym akapitem.
#
# Klastry wzięte z docs/plans/blog-aeo-2026-08.md, sekcja 5. Kolejność pozycji
# w tym pliku odzwierciedla priorytet z tamtej sekcji (koszty projektu i własne
# dane pierwsze), nie kolejność alfabetyczną ani wolumen wyszukiwań.
#
# STATUSY: ready (agent może wziąć w najbliższym przebiegu) / blocked (czeka na
# coś — powód zawsze w `notes`) / done (opublikowane, zostaje w pliku jako
# historia, żeby nikt nie zaproponował tego samego tematu drugi raz).

- slug: ile-kosztuje-aplikacja-mobilna-2026
  cluster: koszty-projektu
  question: Ile kosztuje zbudowanie aplikacji mobilnej?
  angle: >
    Widełki czasowe (nie tylko cenowe) rozbite na trzy poziomy zakresu, plus
    opłaty producentów (Apple/Google), których inne teksty na rynku pomijają.
  fanout:
    - Ile kosztuje prosta aplikacja na jedną platformę?
    - Czy aplikacja natywna jest droższa niż cross-platformowa?
    - Jakie opłaty trzeba ponieść niezależnie od wykonawcy?
    - Jak obniżyć koszt, zaczynając od jednej platformy?
    - Ile trwa zbudowanie aplikacji z płatnościami i kontem klienta?
  sources_hint: "/ile-kosztuje-aplikacji na programo.pl, developer.apple.com, support.google.com/googleplay"
  status: done
  notes: Opublikowany 2026-08-08, src/content/blog/ile-kosztuje-aplikacja-mobilna-2026.mdx.

- slug: next-js-czy-wordpress-strona-firmowa
  cluster: porownania-technologii
  question: Next.js czy WordPress dla strony firmowej?
  angle: >
    Porównanie po realnych kryteriach decyzyjnych (wydajność, koszt utrzymania,
    kto może edytować treść), nie po "co jest nowsze".
  fanout:
    - Czy WordPress jest wolniejszy od Next.js?
    - Ile kosztuje utrzymanie strony na WordPressie w porównaniu do Next.js?
    - Kto może samodzielnie edytować treść na obu platformach?
    - Kiedy WordPress jest lepszym wyborem niż framework JS?
    - Jaki jest realny udział WordPressa wśród stron internetowych?
  sources_hint: W3Techs (udział WordPressa), dokumentacja Next.js ISR
  status: done
  notes: Opublikowany 2026-08-08, src/content/blog/next-js-czy-wordpress-strona-firmowa.mdx.

- slug: ile-kosztuje-strona-internetowa-mala-firma-2026
  cluster: koszty-projektu
  question: Ile kosztuje strona internetowa dla małej firmy w 2026 roku?
  angle: >
    Odpowiednik posta o aplikacji mobilnej, ale dla stron www — widełki wg
    zakresu (wizytówka, strona z CMS-em, strona z integracjami), bez podawania
    całkowitych cen (decyzja Wojtka z 2026-08-08, patrz plan sekcja 5) tylko
    czasu pracy jako proxy kosztu.
  fanout:
    - Ile kosztuje prosta strona wizytówkowa?
    - Ile kosztuje strona z panelem CMS do samodzielnej edycji?
    - Od czego zależy cena strony internetowej?
    - Czy tańsza strona się opłaca na dłuższą metę?
    - Ile trwa zbudowanie strony firmowej?
  sources_hint: /ile-kosztuje-aplikacji na programo.pl, własne dane z projects.ts
  status: ready
  notes: ""

- slug: ile-kosztuje-sklep-internetowy-2026
  cluster: koszty-projektu
  question: Ile kosztuje sklep internetowy w 2026 roku?
  angle: >
    Widełki czasowe dla e-commerce z rozbiciem na platformę gotową vs. sklep
    szyty na miarę — czego brakuje w typowych cennikach agencji (integracja
    płatności, magazyn, wysyłki).
  fanout:
    - Ile kosztuje sklep na gotowej platformie (Shopify, WooCommerce)?
    - Ile kosztuje sklep internetowy szyty na miarę?
    - Co podnosi koszt integracji płatności i wysyłek?
    - Czy warto zaczynać od gotowej platformy i migrować później?
    - Czy sklep szyty na miarę zwraca się przy większej skali?
  sources_hint: cenniki Shopify/WooCommerce (publiczne, do sprawdzenia na żywo), własne dane
  status: ready
  notes: ""

- slug: woocommerce-czy-shopify-maly-sklep
  cluster: porownania-technologii
  question: WooCommerce czy Shopify dla małego sklepu internetowego?
  angle: >
    Porównanie modelu kosztowego (subskrypcja vs. hosting własny) i realnej
    elastyczności, nie tylko listy funkcji ze stron marketingowych obu platform.
  fanout:
    - Ile kosztuje Shopify miesięcznie?
    - Czy WooCommerce jest darmowy?
    - Który jest łatwiejszy do samodzielnego prowadzenia?
    - Który lepiej się skaluje przy dużym katalogu produktów?
    - Czy da się przenieść sklep z Shopify na WooCommerce później?
  sources_hint: cenniki Shopify i kosztorys hostingu WooCommerce (do sprawdzenia na żywo)
  status: ready
  notes: ""

- slug: aplikacja-natywna-czy-cross-platform
  cluster: porownania-technologii
  question: Aplikacja natywna czy cross-platform (React Native, Flutter)?
  angle: >
